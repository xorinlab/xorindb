name: Release and Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core/**'
      - 'package.json'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run --filter xorindb build

      - name: Publish to npm
        run: |
          cd packages/core
          # Check if the current version is already published on npm
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view xorindb version 2>/dev/null || echo "none")

          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "Publishing version $CURRENT_VERSION..."
            npm publish --access public
          else
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
